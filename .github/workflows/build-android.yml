name: Build Android APK — Thawani Lamsa Soft POS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 (stable on ubuntu-22.04) ──────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node 20 ────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 4. Install npm dependencies ───────────────────────────────────────
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ── 5. Create .env ────────────────────────────────────────────────────
      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"                                                              >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}"           >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}"    >> .env

      # ── 6. Build web assets ───────────────────────────────────────────────
      - name: Build web assets (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      # ── 7. Capacitor — add + sync Android ────────────────────────────────
      - name: Add Android platform (if not present)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor to Android
        run: npx cap sync android

      # ── 8. Patch Gradle — inject Thawani Maven repo ───────────────────────
      - name: Patch Gradle repositories (Thawani Maven + JitPack)
        env:
          THAWANI_MAVEN_USER:  ${{ secrets.THAWANI_MAVEN_USER }}
          THAWANI_MAVEN_TOKEN: ${{ secrets.THAWANI_MAVEN_TOKEN }}
        run: |
          python3 << PYEOF
          import os, re
          from pathlib import Path

          user  = os.environ.get("THAWANI_MAVEN_USER",  "")
          token = os.environ.get("THAWANI_MAVEN_TOKEN", "")

          thawani_groovy = """    maven {
                  url "https://maven.pkg.github.com/ThawaniMobile/Lamsa-SDK"
                  credentials {
                      username "${user}"
                      password "${token}"
                  }
              }""".replace("${user}", user).replace("${token}", token)

          jitpack_groovy = '        maven { url "https://jitpack.io" }'

          thawani_kts = """    maven {
                  url = uri("https://maven.pkg.github.com/ThawaniMobile/Lamsa-SDK")
                  credentials {
                      username = "{user}"
                      password = "{token}"
                  }
              }""".replace("{user}", user).replace("{token}", token)

          jitpack_kts = '        maven { url = uri("https://jitpack.io") }'

          def patch(filepath, check_str, snippet):
              p = Path(filepath)
              if not p.exists():
                  return
              text = p.read_text()
              if check_str in text:
                  print(f"  {filepath}: already has {check_str!r}")
                  return
              patched = re.sub(r'(repositories\s*\{)', r'\1\n' + snippet, text, count=1)
              if patched != text:
                  p.write_text(patched)
                  print(f"  Patched {filepath}")

          print("Patching Groovy Gradle files...")
          for f in ["android/settings.gradle", "android/build.gradle", "android/app/build.gradle"]:
              patch(f, "ThawaniMobile", thawani_groovy)
              patch(f, "jitpack.io",    jitpack_groovy)

          print("Patching KTS Gradle files...")
          for f in ["android/settings.gradle.kts", "android/build.gradle.kts", "android/app/build.gradle.kts"]:
              patch(f, "ThawaniMobile", thawani_kts)
              patch(f, "jitpack.io",    jitpack_kts)

          print("Done.")
          PYEOF

      # ── 9. Add dataBinding + Lamsa SDK dependency ─────────────────────────
      - name: Add dataBinding + Lamsa SDK dependency
        env:
          THAWANI_MAVEN_USER:  ${{ secrets.THAWANI_MAVEN_USER }}
          THAWANI_MAVEN_TOKEN: ${{ secrets.THAWANI_MAVEN_TOKEN }}
        run: |
          HAS_CREDS="false"
          if [ -n "$THAWANI_MAVEN_USER" ] && [ -n "$THAWANI_MAVEN_TOKEN" ]; then
            HAS_CREDS="true"
          fi
          echo "Thawani Maven credentials present: $HAS_CREDS"

          python3 << PYEOF
          import os, re
          from pathlib import Path

          has_creds = os.environ.get("THAWANI_MAVEN_USER", "") != ""

          for name in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text()

              # Add dataBinding inside buildFeatures block or create one
              if "dataBinding" not in text:
                  if "buildFeatures" in text:
                      text = re.sub(
                          r'(buildFeatures\s*\{)',
                          r'\1\n        dataBinding true',
                          text, count=1
                      )
                  else:
                      text = re.sub(
                          r'(android\s*\{)',
                          r'\1\n    buildFeatures {\n        dataBinding true\n    }',
                          text, count=1
                      )
                  print(f"  Added dataBinding to {name}")

              # Add Lamsa SDK dependency
              if has_creds and "om.thawani" not in text:
                  text = re.sub(
                      r'(dependencies\s*\{)',
                      r'\1\n    implementation("om.thawani:lamsa.sdk:0.0.22")',
                      text, count=1
                  )
                  print(f"  Added Lamsa SDK dependency to {name}")
              elif not has_creds:
                  print(f"  Skipping Lamsa SDK (no credentials) for {name}")

              p.write_text(text)

          print("Done.")
          PYEOF

      # ── 10. Copy fixed ThawaniLamsaPlugin.java ────────────────────────────
      - name: Copy ThawaniLamsaPlugin.java
        run: |
          PLUGIN_DIR="android/app/src/main/java/app/lovable/awkafpaymentkiosk"
          mkdir -p "$PLUGIN_DIR"
          if [ -f "android-plugin/ThawaniLamsaPlugin.java" ]; then
            cp android-plugin/ThawaniLamsaPlugin.java "$PLUGIN_DIR/"
            echo "Copied ThawaniLamsaPlugin.java to $PLUGIN_DIR"
          else
            echo "ERROR: android-plugin/ThawaniLamsaPlugin.java not found"
            exit 1
          fi

      # ── 11. Register plugin in MainActivity ───────────────────────────────
      - name: Register ThawaniLamsaPlugin in MainActivity
        run: |
          python3 << 'PYEOF'
          import re, glob
          from pathlib import Path

          for pattern in [
              "android/app/src/main/java/**/MainActivity.java",
              "android/app/src/main/java/**/MainActivity.kt",
          ]:
              for f in glob.glob(pattern, recursive=True):
                  p    = Path(f)
                  text = p.read_text()

                  if "ThawaniLamsaPlugin" in text:
                      print(f"  Already registered in {p}")
                      continue

                  if f.endswith(".java"):
                      # Add import
                      if "import app.lovable.awkafpaymentkiosk.ThawaniLamsaPlugin;" not in text:
                          text = re.sub(
                              r"(import android\.os\.Bundle;)",
                              r"\1\nimport app.lovable.awkafpaymentkiosk.ThawaniLamsaPlugin;",
                              text, count=1
                          )
                      # Register plugin after super.onCreate
                      text = re.sub(
                          r"(super\.onCreate\(savedInstanceState\);)",
                          r"\1\n        registerPlugin(ThawaniLamsaPlugin.class);",
                          text, count=1
                      )

                  p.write_text(text)
                  print(f"  Registered ThawaniLamsaPlugin in {p}")

          print("Done.")
          PYEOF

      # ── 12. USB device filter XML ─────────────────────────────────────────
      - name: Create USB device filter XML
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/device_filter.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device vendor-id="1478" product-id="36923" />
              <usb-device vendor-id="1478" product-id="36945" />
              <usb-device vendor-id="3398" product-id="16385" />
              <usb-device vendor-id="7568" product-id="8218"  />
              <usb-device vendor-id="6790" product-id="29987" />
              <usb-device class="2"  subclass="2" protocol="1" />
          </resources>
          EOF

      # ── 13. Patch AndroidManifest ─────────────────────────────────────────
      - name: Patch AndroidManifest.xml (NFC + LamsaSDK activity)
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          p   = Path("android/app/src/main/AndroidManifest.xml")
          xml = p.read_text()

          # NFC permission + feature
          if "android.permission.NFC" not in xml:
              xml = xml.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.NFC" />\n'
                  '    <uses-feature android:name="android.hardware.nfc" android:required="false" />\n'
                  '    <uses-feature android:name="android.hardware.usb.host" android:required="false" />\n'
                  '    <application',
                  1
              )
              print("  Added NFC + USB permissions")

          # LamsaSDK Activity (mandatory — SDK will crash without it)
          if "om.thawani.lamsa.sdk.LamsaSDK" not in xml:
              xml = xml.replace(
                  "</application>",
                  '        <activity\n'
                  '            android:name="om.thawani.lamsa.sdk.LamsaSDK"\n'
                  '            android:exported="false" />\n'
                  '    </application>',
                  1
              )
              print("  Registered LamsaSDK activity")

          p.write_text(xml)
          print("  AndroidManifest.xml patched")
          PYEOF

      # ── 14. Android SDK setup ─────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Accept SDK licences
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # ── 15. Build APK ─────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build Debug APK
        working-directory: android
        env:
          THAWANI_MAVEN_USER:  ${{ secrets.THAWANI_MAVEN_USER }}
          THAWANI_MAVEN_TOKEN: ${{ secrets.THAWANI_MAVEN_TOKEN }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # ── 16. Upload APK ────────────────────────────────────────────────────
      - name: Find APK
        id: find_apk
        run: |
          APK=$(find android/app/build/outputs -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK found: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: awkaf-kiosk-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      # ── 17. GitHub Release ────────────────────────────────────────────────
      - name: Upload Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Awkaf Kiosk v${{ github.run_number }} — Lamsa Soft POS"
          body: |
            ## Awkaf Payment Kiosk APK

            ✅ Thawani Lamsa SDK (NFC Soft POS)
            ✅ Fixed bridge: SDKInitOptions / result keys
            ✅ Bilingual UI (Arabic / English)
            ✅ Supabase admin panel integration
            ✅ Offline payment queue

            **Build:** #${{ github.run_number }} | **Commit:** ${{ github.sha }}

            ### Install
            Download `awkaf-kiosk-debug.apk` below and sideload onto your kiosk device.

            ### Activate live payments
            Admin Panel → Kiosk Settings → Soft POS → Mode: **live**
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 18. Always show tail of Gradle log on failure ────────────────────
      - name: Show Gradle log on failure
        if: failure()
        working-directory: android
        run: ./gradlew assembleDebug --info --no-daemon 2>&1 | tail -200 || true
