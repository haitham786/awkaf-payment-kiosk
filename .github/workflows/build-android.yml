name: Build Android APK with USB Support

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          # Backward-compat (if anything still reads the older name)
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build web assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Add Android platform (if needed)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Create USB device filter XML
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/device_filter.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- OM-A880 POS (CDC ACM) - User's confirmed device -->
              <usb-device vendor-id="1478" product-id="36923" />
              
              <!-- Qualcomm variants -->
              <usb-device vendor-id="1478" product-id="36945" />
              <usb-device vendor-id="1478" product-id="36946" />
              
              <!-- OMA Emirates variants -->
              <usb-device vendor-id="3398" product-id="16385" />
              <usb-device vendor-id="3398" product-id="16386" />
              
              <!-- Newland POS -->
              <usb-device vendor-id="7568" product-id="8218" />
              
              <!-- CH340 USB Serial -->
              <usb-device vendor-id="6790" product-id="29987" />
              
              <!-- Prolific PL2303 -->
              <usb-device vendor-id="1659" product-id="8963" />
              
              <!-- FTDI -->
              <usb-device vendor-id="1027" product-id="24577" />
              
              <!-- CP210x -->
              <usb-device vendor-id="4292" product-id="60000" />
              
              <!-- Generic CDC ACM -->
              <usb-device class="2" subclass="2" protocol="1" />
          </resources>
          EOF

      - name: Update AndroidManifest.xml with USB permissions
        run: |
          # Add USB host feature
          sed -i 's|<application|<uses-feature android:name="android.hardware.usb.host" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml
          
          # Add USB intent filter and meta-data to MainActivity
          sed -i 's|</activity>|    <intent-filter>\n                <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />\n            </intent-filter>\n            <meta-data\n                android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"\n                android:resource="@xml/device_filter" />\n        </activity>|' android/app/src/main/AndroidManifest.xml

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK (USB enabled)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Rename APK
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release-apks/awkaf-kiosk-usb.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: awkaf-kiosk-usb-apk
          path: release-apks/awkaf-kiosk-usb.apk
          retention-days: 30

      - name: Create Release (on main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: release-apks/awkaf-kiosk-usb.apk
          body: |
            ## Awkaf Payment Kiosk APK
            
            **USB POS Support Included**
            
            ### Installation:
            1. Download `awkaf-kiosk-usb.apk`
            2. Transfer to Samsung A13
            3. Enable "Install from unknown sources" if prompted
            4. Install the APK
            5. Connect OM-A880 POS via USB OTG cable
            6. Grant USB permission when prompted
            
            ### Supported POS:
            - OM-A880 (Vendor: 05C6, Product: 903B)
            - Other CDC ACM USB serial devices
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
