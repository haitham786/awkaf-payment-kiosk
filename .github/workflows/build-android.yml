name: Build Android APK — Thawani Lamsa Soft POS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build web assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync Capacitor
        run: npx cap sync android

      # ── Diagnostic: show all Gradle files so we know their exact structure ─
      - name: Show Gradle file structure (diagnostic)
        run: |
          echo "=== android/settings.gradle ==="
          cat android/settings.gradle 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "=== android/build.gradle ==="
          cat android/build.gradle 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "=== android/app/build.gradle (first 60 lines) ==="
          head -60 android/app/build.gradle 2>/dev/null || echo "NOT FOUND"

      # ── Patch settings.gradle — this is where Capacitor declares repos ────
      # Capacitor 6/7 moves allprojects repositories into settings.gradle
      # using dependencyResolutionManagement. We must patch BOTH files.
      - name: Patch settings.gradle — inject Thawani Maven repo
        env:
          THAWANI_MAVEN_USER:  ${{ secrets.THAWANI_MAVEN_USER }}
          THAWANI_MAVEN_TOKEN: ${{ secrets.THAWANI_MAVEN_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import os, re
          from pathlib import Path

          user  = os.environ.get("THAWANI_MAVEN_USER",  "")
          token = os.environ.get("THAWANI_MAVEN_TOKEN", "")

          print(f"Credentials present: user={bool(user)} token={bool(token)}")

          thawani = (
              '\n        maven {\n'
              '            url "https://maven.pkg.github.com/ThawaniMobile/Lamsa-SDK"\n'
              '            credentials {\n'
              f'                username "{user}"\n'
              f'                password "{token}"\n'
              '            }\n'
              '        }'
          )

          for fname in ["android/settings.gradle", "android/build.gradle"]:
              p = Path(fname)
              if not p.exists():
                  print(f"  {fname} not found — skipping")
                  continue
              text = p.read_text()
              if "ThawaniMobile" in text:
                  print(f"  {fname} already patched")
                  continue
              # Insert into every repositories { } block
              patched = re.sub(r'(repositories\s*\{)', r'\1' + thawani, text)
              if patched != text:
                  p.write_text(patched)
                  print(f"  Patched {fname}")
              else:
                  print(f"  WARNING: no repositories block found in {fname}")

          PYEOF

      - name: Patch android/app/build.gradle — dataBinding + Lamsa dependency
        run: |
          python3 - << 'PYEOF'
          import re
          from pathlib import Path

          p    = Path("android/app/build.gradle")
          text = p.read_text()

          if "dataBinding" not in text:
              if "buildFeatures" in text:
                  text = re.sub(r'(buildFeatures\s*\{)', r'\1\n        dataBinding true', text, count=1)
              else:
                  text = re.sub(r'(android\s*\{)', r'\1\n    buildFeatures {\n        dataBinding true\n    }', text, count=1)
              print("Added dataBinding")

          if "om.thawani" not in text:
              text = re.sub(r'(dependencies\s*\{)', r'\1\n    implementation("om.thawani:lamsa.sdk:0.0.22")', text, count=1)
              print("Added Lamsa SDK dependency")

          p.write_text(text)
          print("android/app/build.gradle done")
          PYEOF

      # ── Show patched files so we can verify in the log ────────────────────
      - name: Show patched Gradle files (verify)
        run: |
          echo "=== android/settings.gradle (patched) ==="
          cat android/settings.gradle 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "=== android/build.gradle (patched) ==="
          cat android/build.gradle 2>/dev/null || echo "NOT FOUND"

      - name: Copy ThawaniLamsaPlugin.java
        run: |
          DIR="android/app/src/main/java/app/lovable/awkafpaymentkiosk"
          mkdir -p "$DIR"
          cp android-plugin/ThawaniLamsaPlugin.java "$DIR/"
          echo "Copied plugin"

      - name: Register plugin in MainActivity
        run: |
          python3 - << 'PYEOF'
          import re, glob
          from pathlib import Path
          for f in glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True):
              p = Path(f)
              text = p.read_text()
              if "ThawaniLamsaPlugin" in text:
                  print(f"Already registered in {p}"); continue
              if "import app.lovable.awkafpaymentkiosk.ThawaniLamsaPlugin;" not in text:
                  text = re.sub(r"(import android\.os\.Bundle;)", r"\1\nimport app.lovable.awkafpaymentkiosk.ThawaniLamsaPlugin;", text, count=1)
              text = re.sub(r"(super\.onCreate\(savedInstanceState\);)", r"\1\n        registerPlugin(ThawaniLamsaPlugin.class);", text, count=1)
              p.write_text(text)
              print(f"Registered in {p}")
          PYEOF

      - name: Patch AndroidManifest.xml
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          xml = p.read_text()
          if "android.permission.NFC" not in xml:
              xml = xml.replace("<application", '<uses-permission android:name="android.permission.NFC" />\n    <uses-feature android:name="android.hardware.nfc" android:required="false" />\n    <application', 1)
          if "om.thawani.lamsa.sdk.LamsaSDK" not in xml:
              xml = xml.replace("</application>", '        <activity android:name="om.thawani.lamsa.sdk.LamsaSDK" android:exported="false" />\n    </application>', 1)
          p.write_text(xml)
          print("AndroidManifest patched")
          PYEOF

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Accept SDK licences
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build Debug APK
        working-directory: android
        env:
          THAWANI_MAVEN_USER:  ${{ secrets.THAWANI_MAVEN_USER }}
          THAWANI_MAVEN_TOKEN: ${{ secrets.THAWANI_MAVEN_TOKEN }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: awkaf-kiosk-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Awkaf Kiosk v${{ github.run_number }} — Lamsa Soft POS"
          body: |
            ## Awkaf Payment Kiosk APK
            Build ${{ github.run_number }} | Commit ${{ github.sha }}
            Thawani Lamsa NFC Soft POS integrated.
            Admin Panel → Kiosk Settings → Soft POS → Mode: live to activate.
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show full Gradle files on failure
        if: failure()
        run: |
          echo "=== android/settings.gradle ===" && cat android/settings.gradle || true
          echo "=== android/build.gradle ===" && cat android/build.gradle || true
          echo "=== android/app/build.gradle ===" && cat android/app/build.gradle || true
