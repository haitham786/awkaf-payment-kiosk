name: Awkaf Donation Platform

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code (git clone - avoids action download timeouts)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          rm -rf ./* ./.??* || true
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}" || git fetch --depth 1 origin "${GITHUB_REF_NAME:-main}"
          git checkout -q FETCH_HEAD
          git rev-parse --short HEAD

      - name: Show toolchain (preinstalled)
        shell: bash
        run: |
          set -euxo pipefail
          node -v
          npm -v
          which sdkmanager || true
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"

      - name: Install Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: package-lock.json

      - name: Verify Java
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Ensure Android SDK is available
        shell: bash
        run: |
          set -euxo pipefail
          if [ -z "${ANDROID_SDK_ROOT:-}" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          fi
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ERROR: ANDROID_SDK_ROOT is not set"
            exit 1
          fi
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_DIR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          else
            SDKMANAGER_PATH="$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
            SDKMANAGER_DIR="$(dirname "${SDKMANAGER_PATH:-}")"
          fi
          if [ -z "${SDKMANAGER_DIR:-}" ] || [ ! -x "$SDKMANAGER_DIR/sdkmanager" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          export PATH="$SDKMANAGER_DIR:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          which sdkmanager
          sdkmanager --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create .env file
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}"
          } > .env

      - name: Build web assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Add Android platform (if needed)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android minimum SDK
        run: |
          python3 - << 'PY'
          from pathlib import Path
          import re
          for name in ["android/variables.gradle", "android/variables.gradle.kts"]:
              path = Path(name)
              if path.exists():
                  path.write_text(re.sub(r'(minSdkVersion\s*=\s*)\d+', r'\g<1>26', path.read_text()))
          PY

      - name: Copy NBO OM-A880 USB plugin
        shell: bash
        run: |
          set -euxo pipefail
          PLUGIN_DIR="android/app/src/main/java/app/lovable/awkafpaymentkiosk"
          mkdir -p "$PLUGIN_DIR"
          test -f "android-plugin/NboEcrPlugin.java" || {
            echo "::error::android-plugin/NboEcrPlugin.java is missing"
            exit 1
          }
          cp "android-plugin/NboEcrPlugin.java" "$PLUGIN_DIR/"
          echo "Copied NboEcrPlugin.java (NBO OM-A880 USB ECR bridge)"

      - name: Register plugin in MainActivity (deterministic rewrite)
        shell: bash
        run: |
          set -euxo pipefail
          python3 - << 'PY'
          from pathlib import Path
          import glob, re

          MAIN_JAVA = (
              "package app.lovable.awkafpaymentkiosk;\n\n"
              "import android.os.Bundle;\n"
              "import com.getcapacitor.BridgeActivity;\n"
              "import app.lovable.awkafpaymentkiosk.NboEcrPlugin;\n\n"
              "public class MainActivity extends BridgeActivity {\n"
              "    @Override\n"
              "    public void onCreate(Bundle savedInstanceState) {\n"
              "        registerPlugin(NboEcrPlugin.class);\n"
              "        super.onCreate(savedInstanceState);\n"
              "    }\n"
              "}\n"
          )

          # Remove any stray Kotlin MainActivity that Capacitor may have generated
          for f in glob.glob("android/app/src/main/java/**/MainActivity.kt", recursive=True):
              Path(f).unlink()
              print(f"Removed Kotlin MainActivity: {f}")

          # Always rewrite the Java MainActivity at the canonical Capacitor path
          target_dir = Path("android/app/src/main/java/app/lovable/awkafpaymentkiosk")
          target_dir.mkdir(parents=True, exist_ok=True)
          target = target_dir / "MainActivity.java"
          target.write_text(MAIN_JAVA, encoding="utf-8")
          print(f"Wrote canonical MainActivity.java at {target}")

          # Remove duplicate MainActivity.java files anywhere else in the source tree
          for f in glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True):
              p = Path(f).resolve()
              if p != target.resolve():
                  p.unlink()
                  print(f"Removed duplicate MainActivity.java: {p}")
          PY

      - name: Assert MainActivity registers NBO plugin
        shell: bash
        run: |
          set -euxo pipefail
          MAIN="android/app/src/main/java/app/lovable/awkafpaymentkiosk/MainActivity.java"
          test -f "$MAIN" || { echo "::error::MainActivity.java missing at $MAIN"; exit 1; }
          echo "=== Final MainActivity.java ==="
          cat "$MAIN"
          echo "==============================="
          grep -q "extends BridgeActivity" "$MAIN" || { echo "::error::MainActivity does not extend BridgeActivity"; exit 1; }
          grep -q "import android.os.Bundle;" "$MAIN" || { echo "::error::Missing Bundle import"; exit 1; }
          grep -q "registerPlugin(NboEcrPlugin.class);" "$MAIN" || { echo "::error::NboEcrPlugin is not registered"; exit 1; }
          NBO="android/app/src/main/java/app/lovable/awkafpaymentkiosk/NboEcrPlugin.java"
          test -f "$NBO" || { echo "::error::NboEcrPlugin.java was not copied to $NBO"; exit 1; }
          echo "✓ NboEcrPlugin.java is present and registered"

      - name: Create USB device filter XML
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/device_filter.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device vendor-id="1478" product-id="36923" />
              <usb-device vendor-id="1478" product-id="36945" />
              <usb-device vendor-id="1478" product-id="36946" />
              <usb-device vendor-id="3398" product-id="16385" />
              <usb-device vendor-id="3398" product-id="16386" />
              <usb-device vendor-id="7568" product-id="8218" />
              <usb-device vendor-id="6790" product-id="29987" />
              <usb-device vendor-id="1659" product-id="8963" />
              <usb-device vendor-id="1027" product-id="24577" />
              <usb-device vendor-id="4292" product-id="60000" />
              <usb-device class="2" subclass="2" protocol="1" />
          </resources>
          EOF

      - name: Patch AndroidManifest.xml for USB
        shell: bash
        run: |
          set -euxo pipefail
          python3 - << 'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              raise SystemExit("AndroidManifest.xml not found")
          xml = p.read_text(encoding="utf-8")
          if "android.hardware.usb.host" not in xml:
              xml = xml.replace("<application", '<uses-feature android:name="android.hardware.usb.host" android:required="false" />\n    <application', 1)
          if "android.hardware.usb.action.USB_DEVICE_ATTACHED" not in xml:
              inject = '\n                <intent-filter>\n                    <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />\n                </intent-filter>\n                <meta-data\n                    android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"\n                    android:resource="@xml/device_filter" />\n        '
              pattern_main = r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>)(.*?)(</activity>)'
              m = re.search(pattern_main, xml, flags=re.S)
              if not m:
                  pattern_any = r'(<activity\b[^>]*>)(.*?)(</activity>)'
                  for mi in re.finditer(pattern_any, xml, flags=re.S):
                      block = mi.group(0)
                      if "android.intent.action.MAIN" in block and "android.intent.category.LAUNCHER" in block:
                          m = mi
                          break
              if m:
                  head, body, tail = m.group(1), m.group(2), m.group(3)
                  xml = xml[:m.start(0)] + head + body + inject + tail + xml[m.end(0):]
          p.write_text(xml, encoding="utf-8")
          print("AndroidManifest.xml patched (USB)")
          PY

      - name: Generate Awkaf Android launcher icons
        shell: bash
        run: |
          set -euxo pipefail
          for source in android-assets/mipmap-*; do
            test -d "$source" || {
              echo "::error::Bundled Android launcher icons are missing"
              exit 1
            }
            target="android/app/src/main/res/$(basename "$source")"
            mkdir -p "$target"
            cp "$source/ic_launcher.png" "$target/ic_launcher.png"
            cp "$source/ic_launcher_round.png" "$target/ic_launcher_round.png"
          done
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Verify Android SDK tools + accept licenses
        shell: bash
        run: |
          set -euxo pipefail
          which sdkmanager
          sdkmanager --version
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          if sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"; then
            echo "Installed Android SDK 35"
          else
            sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
            if [ -f android/variables.gradle ]; then
              perl -pi -e 's/(compileSdkVersion\s*=\s*)\d+/${1}34/g; s/(targetSdkVersion\s*=\s*)\d+/${1}34/g' android/variables.gradle || true
            fi
          fi

      - name: Ensure Android SDK path (local.properties)
        shell: bash
        run: |
          set -euxo pipefail
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties

      - name: Create temporary APK signing key
        shell: bash
        run: |
          set -euxo pipefail
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore android/app/awkaf-release-key.p12 \
            -alias awkaf_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Awkaf Payment Kiosk, OU=Kiosk, O=Awkaf, L=Muscat, ST=Muscat, C=OM"

      - name: Build unsigned Release APK
        working-directory: android
        shell: bash
        timeout-minutes: 20
        run: |
          set -euxo pipefail
          echo "Building Awkaf Donation Platform APK with NBO OM-A880 USB support"
          # Maven Central occasionally rate-limits GitHub's shared runners with
          # HTTP 429. Reuse the Gradle cache and retry only the same safe build;
          # do not alter or bypass any NBO native integration dependencies.
          build_succeeded=false
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if ./gradlew assembleRelease \
              -Pandroid.injected.testOnly=false \
              --stacktrace --info --no-daemon --max-workers=2 \
              2>&1 | tee ../android-gradle.log; then
              build_succeeded=true
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 45))
              echo "Gradle dependency service was unavailable; retrying in ${delay}s"
              sleep "$delay"
            fi
          done

          if [ "$build_succeeded" != "true" ]; then
            echo "::error::Android release build failed after 3 attempts"
            exit 1
          fi

      - name: Sign release APK externally
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-apks
          BUILD_TOOLS_DIR="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -type f \( -name '*-unsigned.apk' -o -name '*.apk' \) | head -n 1)"
          test -n "$UNSIGNED_APK"
          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" release-apks/awkaf-kiosk-usb-aligned.apk
          "$APKSIGNER" sign \
            --ks android/app/awkaf-release-key.p12 \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias awkaf_release \
            --out release-apks/awkaf-kiosk-usb.apk \
            release-apks/awkaf-kiosk-usb-aligned.apk
          "$APKSIGNER" verify --verbose release-apks/awkaf-kiosk-usb.apk

      - name: List Android build outputs (always)
        if: always()
        shell: bash
        run: |
          find android -maxdepth 8 -type f \( -name "*.apk" -o -name "*.log" \) 2>/dev/null || true
          if [ -f android-gradle.log ]; then
            tail -n 200 android-gradle.log || true
          fi

      - name: Collect APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          test -f release-apks/awkaf-kiosk-usb.apk
          ls -lh release-apks/awkaf-kiosk-usb.apk

      - name: Verify APK is installable (no testOnly flag, valid signature)
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          APK="release-apks/awkaf-kiosk-usb.apk"
          BUILD_TOOLS_DIR="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          echo "=== APK file info ==="
          ls -lh "$APK"
          file "$APK"
          echo ""
          echo "=== Manifest flags (testOnly must be absent / false) ==="
          if [ -x "$AAPT" ]; then
            "$AAPT" dump badging "$APK" 2>&1 | head -20 || true
            TEST_ONLY="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml 2>/dev/null | grep -i 'testOnly' || true)"
            if echo "$TEST_ONLY" | grep -q '0xffffffff\|=true\|=(type 0x12)0xffffffff'; then
              echo "::error::APK has testOnly=true flag. It will fail to install via sideload."
              echo "$TEST_ONLY"
              exit 1
            fi
            echo "✓ testOnly flag is not set (sideload-installable)"
          fi
          echo ""
          echo "=== Signature verification (v1/v2/v3) ==="
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK" || {
              echo "::error::APK signature verification failed"
              exit 1
            }
            echo "✓ APK signature is valid"
          fi

      - name: Verify NBO Capacitor bridge in APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          APK="release-apks/awkaf-kiosk-usb.apk"
          unzip -l "$APK" | grep -E 'classes[0-9]*\.dex'
          rm -rf /tmp/apk-dex-check
          mkdir -p /tmp/apk-dex-check
          unzip -q "$APK" 'classes*.dex' -d /tmp/apk-dex-check
          if ! grep -aR "app/lovable/awkafpaymentkiosk/NboEcrPlugin" /tmp/apk-dex-check >/dev/null; then
            echo "::error::Capacitor bridge class NboEcrPlugin is missing from the APK dex files."
            exit 1
          fi
          if ! grep -aR "app/lovable/awkafpaymentkiosk/MainActivity" /tmp/apk-dex-check >/dev/null; then
            echo "::error::MainActivity class is missing from the APK dex files."
            exit 1
          fi
          echo "✓ NBO Capacitor bridge classes are bundled in the APK"

      - name: Add installation instructions beside APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          cat > release-apks/README-INSTALL.txt << 'EOF'
          IMPORTANT:
          Install ONLY the file named awkaf-kiosk-usb.apk.

          If you download from GitHub Actions, GitHub gives you a ZIP file.
          Android cannot install that ZIP directly and may show:
          "Unable to open document. Reason: Internal error occurred"

          Correct install options:
          1. Best: open this workflow's GitHub Release and download awkaf-kiosk-usb.apk directly.
          2. Or: unzip the GitHub Actions artifact first, then install awkaf-kiosk-usb.apk from inside it.
          This APK is a signed release build, not a debug/test APK.
          EOF

      - name: Upload ZIP artifact (unzip before installing)
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: UNZIP-FIRST-then-install-awkaf-kiosk-usb-apk
          path: |
            release-apks/awkaf-kiosk-usb.apk
            release-apks/README-INSTALL.txt
          retention-days: 30

      - name: Create GitHub Release with APK
        if: success() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          TAG="v${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag -y
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push origin ":refs/tags/$TAG"
          fi
          gh release create "$TAG" release-apks/awkaf-kiosk-usb.apk \
            --title "Release $TAG" \
            --notes "Download the APK from this Release asset directly on the Android device. Do not install the GitHub Actions artifact ZIP; if you downloaded the artifact, unzip it first and install awkaf-kiosk-usb.apk from inside. Awkaf Donation Platform APK - NBO OM-A880 USB POS + bilingual kiosk UI"
