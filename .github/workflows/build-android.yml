name: Build Android APK with USB Support

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          # Backward-compat (if anything still reads the older name)
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build web assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Add Android platform (if needed)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Create USB device filter XML
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/device_filter.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- OM-A880 POS (CDC ACM) - User's confirmed device -->
              <usb-device vendor-id="1478" product-id="36923" />
              
              <!-- Qualcomm variants -->
              <usb-device vendor-id="1478" product-id="36945" />
              <usb-device vendor-id="1478" product-id="36946" />
              
              <!-- OMA Emirates variants -->
              <usb-device vendor-id="3398" product-id="16385" />
              <usb-device vendor-id="3398" product-id="16386" />
              
              <!-- Newland POS -->
              <usb-device vendor-id="7568" product-id="8218" />
              
              <!-- CH340 USB Serial -->
              <usb-device vendor-id="6790" product-id="29987" />
              
              <!-- Prolific PL2303 -->
              <usb-device vendor-id="1659" product-id="8963" />
              
              <!-- FTDI -->
              <usb-device vendor-id="1027" product-id="24577" />
              
              <!-- CP210x -->
              <usb-device vendor-id="4292" product-id="60000" />
              
              <!-- Generic CDC ACM -->
              <usb-device class="2" subclass="2" protocol="1" />
          </resources>
          EOF

      - name: Patch AndroidManifest.xml for USB (idempotent)
        shell: bash
        run: |
          set -euxo pipefail
          python - << 'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          xml = p.read_text(encoding="utf-8")

          # Ensure USB host feature (only once)
          if "android.hardware.usb.host" not in xml:
              xml = xml.replace(
                  "<application",
                  '<uses-feature android:name="android.hardware.usb.host" android:required="false" />\n    <application',
                  1,
              )

          # Attach USB_DEVICE_ATTACHED intent filter + metadata to MainActivity (only once)
          if "android.hardware.usb.action.USB_DEVICE_ATTACHED" not in xml:
              pattern = r'(<activity\\b[^>]*android:name="[^"]*MainActivity"[^>]*>)(.*?)</activity>'
              m = re.search(pattern, xml, flags=re.S)
              if not m:
                  raise SystemExit(
                      "MainActivity not found in AndroidManifest.xml; cannot attach USB intent filter"
                  )

              head, body = m.group(1), m.group(2)
              inject = """
                      <intent-filter>
                          <action android:name=\"android.hardware.usb.action.USB_DEVICE_ATTACHED\" />
                      </intent-filter>
                      <meta-data
                          android:name=\"android.hardware.usb.action.USB_DEVICE_ATTACHED\"
                          android:resource=\"@xml/device_filter\" />
              """
              xml = xml[: m.start(0)] + head + body + inject + "</activity>" + xml[m.end(0) :]

          p.write_text(xml, encoding="utf-8")
          print("AndroidManifest.xml patched successfully")
          PY

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Verify Android SDK tools + accept licenses
        shell: bash
        run: |
          set -euxo pipefail
          which sdkmanager
          sdkmanager --version
          yes | sdkmanager --licenses

      - name: Install Android SDK packages (try 35, fallback 34)
        shell: bash
        run: |
          set -euxo pipefail

          # Modern Capacitor templates commonly use compileSdk 35. Install it if available.
          if sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"; then
            echo "Installed Android SDK 35"
          else
            echo "Android SDK 35 not available; falling back to 34"
            sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

            # Force project to use 34 to avoid compileSdk mismatch
            if [ -f android/variables.gradle ]; then
              perl -pi -e 's/(compileSdkVersion\\s*=\\s*)\\d+/${1}34/g; s/(targetSdkVersion\\s*=\\s*)\\d+/${1}34/g' android/variables.gradle || true
              echo "Updated android/variables.gradle to SDK 34:" 
              cat android/variables.gradle
            fi
          fi

      - name: Ensure Android SDK path (local.properties)
        shell: bash
        run: |
          set -euxo pipefail
          test -d android || (echo "ERROR: android/ platform folder missing" && exit 1)
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties
          cat android/local.properties

      - name: Build Debug APK (USB enabled)
        working-directory: android
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew assembleDebug --stacktrace --info --no-daemon 2>&1 | tee ../android-gradle.log

      - name: Upload Gradle reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-reports
          path: |
            android/app/build/reports/**
            android/app/build/outputs/logs/**
            android/build/reports/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Gradle console log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-log
          path: android-gradle.log
          if-no-files-found: warn
          retention-days: 7

      - name: List Android build outputs (always)
        if: always()
        run: |
          echo "Android build outputs:"
          find android -maxdepth 5 -type f -name "*.apk" -o -name "*.aab" -o -name "*.log" -o -name "*.txt" 2>/dev/null || true
          find android/app/build/outputs -maxdepth 8 -type f 2>/dev/null || true

      - name: Collect APK
        if: success()
        run: |
          set -euxo pipefail
          mkdir -p release-apks

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs -type f -name "*.apk" 2>/dev/null | head -n 1 || true)
          fi

          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" release-apks/awkaf-kiosk-usb.apk
          else
            echo "ERROR: APK not found under android/app/build/outputs"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: awkaf-kiosk-usb-apk
          path: release-apks/awkaf-kiosk-usb.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release (on main branch)
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: release-apks/awkaf-kiosk-usb.apk
          body: |
            ## Awkaf Payment Kiosk APK
            
            **USB POS Support Included**
            
            ### Installation:
            1. Download `awkaf-kiosk-usb.apk`
            2. Transfer to Samsung A13
            3. Enable "Install from unknown sources" if prompted
            4. Install the APK
            5. Connect OM-A880 POS via USB OTG cable
            6. Grant USB permission when prompted
            
            ### Supported POS:
            - OM-A880 (Vendor: 05C6, Product: 903B)
            - Other CDC ACM USB serial devices
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
