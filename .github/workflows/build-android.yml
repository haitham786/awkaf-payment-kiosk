name: Build Android APK with USB Support

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Thawani GitHub Packages credentials (REQUIRED)
      # NOTE: GitHub will return 404 for private packages when the token is missing/unauthorized,
      # which shows up in Gradle as "Could not find om.thawani:lamsa.sdk:0.0.22".
      LAMSA_MAVEN_USERNAME: ${{ secrets.LAMSA_MAVEN_USERNAME || github.actor }}
      LAMSA_MAVEN_TOKEN: ${{ secrets.LAMSA_MAVEN_TOKEN || secrets.THAWANI_GITHUB_PACKAGES_TOKEN || secrets.GH_PACKAGES_TOKEN }}

    steps:
      - name: Checkout code (git clone - avoids action download timeouts)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          rm -rf ./* ./.??* || true
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_REF_NAME}"
          git checkout -q FETCH_HEAD
          git rev-parse --short HEAD

      - name: Validate Thawani Maven credentials (fail fast)
        shell: bash
        run: |
          set -euxo pipefail

          if [ -z "${LAMSA_MAVEN_TOKEN:-}" ]; then
            echo "ERROR: Missing GitHub Packages token for Thawani Lamsa SDK."
            echo "Add a repository secret named LAMSA_MAVEN_TOKEN (or THAWANI_GITHUB_PACKAGES_TOKEN / GH_PACKAGES_TOKEN)."
            exit 1
          fi

          echo "LAMSA_MAVEN_USERNAME=${LAMSA_MAVEN_USERNAME}"
          echo "LAMSA_MAVEN_TOKEN is set (masked)"

          # GitHub Packages returns 404 when a package is private AND your token is missing/unauthorized.
          # We test access explicitly here so the workflow fails fast with a clear error.
          METADATA_URL="https://maven.pkg.github.com/ThawaniMobile/Lamsa-SDK/om/thawani/lamsa.sdk/maven-metadata.xml"
          HTTP_CODE=$(curl -sS -u "${LAMSA_MAVEN_USERNAME}:${LAMSA_MAVEN_TOKEN}" -o /dev/null -w "%{http_code}" "$METADATA_URL" || true)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Cannot access Thawani GitHub Packages ($METADATA_URL). HTTP $HTTP_CODE"
            echo "This build cannot succeed until GitHub Packages credentials with access to ThawaniMobile/Lamsa-SDK are configured."
            exit 1
          fi


      - name: Show toolchain (preinstalled)
        shell: bash
        run: |
          set -euxo pipefail
          node -v
          npm -v
          which sdkmanager || true
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}" 
          echo "ANDROID_HOME=${ANDROID_HOME:-}"

      - name: Install Java 21 (APT) - avoid action download timeouts
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk

          # Force Java 21 as the active toolchain (otherwise the runner may keep Java 17 as default)
          if [ -x /usr/lib/jvm/java-21-openjdk-amd64/bin/java ]; then
            sudo update-alternatives --set java /usr/lib/jvm/java-21-openjdk-amd64/bin/java
            sudo update-alternatives --set javac /usr/lib/jvm/java-21-openjdk-amd64/bin/javac
          fi

          java -version
          javac -version

          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

      - name: Ensure Android SDK is available (sdkmanager in PATH)
        shell: bash
        run: |
          set -euxo pipefail

          # Prefer runner-preinstalled SDK
          if [ -z "${ANDROID_SDK_ROOT:-}" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          # If still unset, fail early with a clear message
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ERROR: ANDROID_SDK_ROOT is not set and /usr/local/lib/android/sdk not found"
            exit 1
          fi

          # Make sdkmanager available in PATH (runner often has it but doesn't expose PATH)
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_DIR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          else
            SDKMANAGER_PATH="$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
            SDKMANAGER_DIR="$(dirname "${SDKMANAGER_PATH:-}")"
          fi

          if [ -z "${SDKMANAGER_DIR:-}" ] || [ ! -x "$SDKMANAGER_DIR/sdkmanager" ]; then
            echo "ERROR: sdkmanager not found under $ANDROID_SDK_ROOT"
            echo "Contents (top-level):"
            ls -la "$ANDROID_SDK_ROOT" || true
            exit 1
          fi

          export PATH="$SDKMANAGER_DIR:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          which sdkmanager
          sdkmanager --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          # Backward-compat (if anything still reads the older name)
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build web assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Add Android platform (if needed)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure Maven repositories (JitPack + Thawani GitHub Packages)
        shell: bash
        run: |
          set -euxo pipefail
          python - << 'PY'
          from pathlib import Path
          import re

          def patch_repositories_block(text: str, snippets: list) -> str:
              patched = text
              for snippet in snippets:
                  if snippet["check"] not in patched:
                      patched = re.sub(r"(repositories\s*\{\s*\n)", r"\1        " + snippet["code"] + "\n", patched)
              return patched

          def patch_file(path: Path, snippets: list) -> None:
              if not path.exists():
                  return
              original = path.read_text(encoding="utf-8")
              patched = patch_repositories_block(original, snippets)
              if patched != original:
                  path.write_text(patched, encoding="utf-8")
                  print(f"Patched {path}")

          # Groovy Gradle files
          groovy_snippets = [
              {"check": "jitpack.io", "code": 'maven { url "https://jitpack.io" }'},
              {
                  "check": "maven.pkg.github.com/ThawaniMobile",
                  "code": 'maven { url "https://maven.pkg.github.com/ThawaniMobile/Lamsa-SDK"; credentials { username = System.getenv("LAMSA_MAVEN_USERNAME") ?: "ThawaniMobile"; password = System.getenv("LAMSA_MAVEN_TOKEN") ?: "" } }',
              },
          ]
          patch_file(Path("android/settings.gradle"), groovy_snippets)
          patch_file(Path("android/build.gradle"), groovy_snippets)
          patch_file(Path("android/app/build.gradle"), groovy_snippets)

          # Kotlin DSL (if present)
          kts_snippets = [
              {"check": "jitpack.io", "code": 'maven { url = uri("https://jitpack.io") }'},
              {
                  "check": "maven.pkg.github.com/ThawaniMobile",
                  "code": 'maven { url = uri("https://maven.pkg.github.com/ThawaniMobile/Lamsa-SDK"); credentials { username = System.getenv("LAMSA_MAVEN_USERNAME") ?: "ThawaniMobile"; password = System.getenv("LAMSA_MAVEN_TOKEN") ?: "" } }',
              },
          ]
          patch_file(Path("android/settings.gradle.kts"), kts_snippets)
          patch_file(Path("android/build.gradle.kts"), kts_snippets)
          patch_file(Path("android/app/build.gradle.kts"), kts_snippets)

          print("Maven repositories configured")
          PY

      - name: Add Thawani Lamsa SDK dependency
        shell: bash
        run: |
          set -euxo pipefail
          GRADLE_FILE="android/app/build.gradle"

          if [ -f "$GRADLE_FILE" ] && ! grep -q "om.thawani:lamsa.sdk" "$GRADLE_FILE"; then
            sed -i '/dependencies {/a\    implementation "om.thawani:lamsa.sdk:0.0.22"' "$GRADLE_FILE"
            echo "Added Thawani Lamsa SDK dependency"
          fi

          # Ensure dataBinding is enabled (required by Lamsa SDK docs)
          python - << 'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("android/app/build.gradle not found")

          t = p.read_text(encoding="utf-8")
          if "dataBinding true" in t:
              print("dataBinding already enabled")
          else:
              if re.search(r"buildFeatures\s*\{", t):
                  t = re.sub(r"(buildFeatures\s*\{\s*\n)", r"\1        dataBinding true\n", t, count=1)
              else:
                  t = re.sub(r"(android\s*\{\s*\n)", r"\1    buildFeatures {\n        dataBinding true\n    }\n", t, count=1)
              p.write_text(t, encoding="utf-8")
              print("Enabled dataBinding")
          PY

      - name: Add Thawani plugin and manifest entries
        shell: bash
        run: |
          set -euxo pipefail
          
          # Create Thawani plugin directory
          PLUGIN_DIR="android/app/src/main/java/app/lovable/awkafpaymentkiosk"
          mkdir -p "$PLUGIN_DIR"
          
          # Copy plugin if exists in repo
          if [ -f "android-plugin/ThawaniLamsaPlugin.java" ]; then
            cp "android-plugin/ThawaniLamsaPlugin.java" "$PLUGIN_DIR/"
            echo "Copied ThawaniLamsaPlugin.java"
          fi
          
          # Patch AndroidManifest for Thawani SDK activity
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "om.thawani.lamsa.sdk.LamsaSDK" "$MANIFEST"; then
            sed -i '/<\/application>/i\        <activity android:name="om.thawani.lamsa.sdk.LamsaSDK" android:parentActivityName=".MainActivity" android:theme="@style/Theme.LamsaSDK" />' "$MANIFEST"
            echo "Added Thawani LamsaSDK activity to manifest"
          fi

      - name: Add ProGuard rules for Thawani SDK
        shell: bash
        run: |
          set -euxo pipefail
          PROGUARD_FILE="android/app/proguard-rules.pro"
          if [ -f "$PROGUARD_FILE" ] && ! grep -q "om.thawani.lamsa.sdk" "$PROGUARD_FILE"; then
            echo "-keep class om.thawani.lamsa.sdk.** { *; }" >> "$PROGUARD_FILE"
            echo "Added Thawani ProGuard rules"
          fi

      - name: Create USB device filter XML
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/device_filter.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- OM-A880 POS (CDC ACM) - User's confirmed device -->
              <usb-device vendor-id="1478" product-id="36923" />
              
              <!-- Qualcomm variants -->
              <usb-device vendor-id="1478" product-id="36945" />
              <usb-device vendor-id="1478" product-id="36946" />
              
              <!-- OMA Emirates variants -->
              <usb-device vendor-id="3398" product-id="16385" />
              <usb-device vendor-id="3398" product-id="16386" />
              
              <!-- Newland POS -->
              <usb-device vendor-id="7568" product-id="8218" />
              
              <!-- CH340 USB Serial -->
              <usb-device vendor-id="6790" product-id="29987" />
              
              <!-- Prolific PL2303 -->
              <usb-device vendor-id="1659" product-id="8963" />
              
              <!-- FTDI -->
              <usb-device vendor-id="1027" product-id="24577" />
              
              <!-- CP210x -->
              <usb-device vendor-id="4292" product-id="60000" />
              
              <!-- Generic CDC ACM -->
              <usb-device class="2" subclass="2" protocol="1" />
          </resources>
          EOF

      - name: Patch AndroidManifest.xml for USB (idempotent)
        shell: bash
        run: |
          set -euxo pipefail
          python - << 'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              raise SystemExit(f"AndroidManifest.xml not found at {p}. Did 'npx cap add/sync android' run?")

          xml = p.read_text(encoding="utf-8")

          # Ensure USB host feature (only once)
          if "android.hardware.usb.host" not in xml:
              xml = xml.replace(
                  "<application",
                  '<uses-feature android:name="android.hardware.usb.host" android:required="false" />\n    <application',
                  1,
              )

          # Attach USB_DEVICE_ATTACHED intent filter + metadata (only once)
          if "android.hardware.usb.action.USB_DEVICE_ATTACHED" not in xml:
              inject = """
                      <intent-filter>
                          <action android:name=\"android.hardware.usb.action.USB_DEVICE_ATTACHED\" />
                      </intent-filter>
                      <meta-data
                          android:name=\"android.hardware.usb.action.USB_DEVICE_ATTACHED\"
                          android:resource=\"@xml/device_filter\" />
              """

              # 1) Prefer MainActivity if present
              pattern_main = r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>)(.*?)(</activity>)'
              m = re.search(pattern_main, xml, flags=re.S)

              # 2) Fallback: inject into launcher activity (MAIN + LAUNCHER)
              if not m:
                  pattern_any = r'(<activity\b[^>]*>)(.*?)(</activity>)'
                  for mi in re.finditer(pattern_any, xml, flags=re.S):
                      block = mi.group(0)
                      if (
                          "android.intent.action.MAIN" in block
                          and "android.intent.category.LAUNCHER" in block
                      ):
                          m = mi
                          break

              if not m:
                  raise SystemExit(
                      "No suitable <activity> found to attach USB intent filter (MainActivity or launcher activity not found)."
                  )

              head, body, tail = m.group(1), m.group(2), m.group(3)
              xml = xml[: m.start(0)] + head + body + inject + tail + xml[m.end(0) :]

          p.write_text(xml, encoding="utf-8")
          print("AndroidManifest.xml patched successfully")
          PY

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Verify Android SDK tools + accept licenses
        shell: bash
        run: |
          set -euxo pipefail
          which sdkmanager
          sdkmanager --version

          # sdkmanager often closes stdin early; with pipefail this makes `yes` exit with SIGPIPE ("Broken pipe")
          # and fails the step even though licenses were accepted.
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail

      - name: Install Android SDK packages (try 35, fallback 34)
        shell: bash
        run: |
          set -euxo pipefail

          # Modern Capacitor templates commonly use compileSdk 35. Install it if available.
          if sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"; then
            echo "Installed Android SDK 35"
          else
            echo "Android SDK 35 not available; falling back to 34"
            sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

            # Force project to use 34 to avoid compileSdk mismatch
            if [ -f android/variables.gradle ]; then
              perl -pi -e 's/(compileSdkVersion\\s*=\\s*)\\d+/${1}34/g; s/(targetSdkVersion\\s*=\\s*)\\d+/${1}34/g' android/variables.gradle || true
              echo "Updated android/variables.gradle to SDK 34:" 
              cat android/variables.gradle
            fi
          fi

      - name: Ensure Android SDK path (local.properties)
        shell: bash
        run: |
          set -euxo pipefail
          test -d android || (echo "ERROR: android/ platform folder missing" && exit 1)
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties
          cat android/local.properties

      - name: Build Debug APK (USB enabled)
        working-directory: android
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew assembleDebug --stacktrace --info --no-daemon 2>&1 | tee ../android-gradle.log

      - name: List Android build outputs (always)
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          echo "Android build outputs:"
          find android -maxdepth 8 -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.log" -o -name "*.txt" \) 2>/dev/null || true
          find android/app/build/outputs -maxdepth 10 -type f 2>/dev/null || true

          if [ -f android-gradle.log ]; then
            echo "---- Last 200 lines of android-gradle.log ----"
            tail -n 200 android-gradle.log || true
          fi

      - name: Collect APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-apks

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs -type f -name "*.apk" 2>/dev/null | head -n 1 || true)
          fi

          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" release-apks/awkaf-kiosk-usb.apk
          else
            echo "ERROR: APK not found under android/app/build/outputs"
            exit 1
          fi

      - name: Upload APK as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: awkaf-kiosk-usb-apk
          path: release-apks/awkaf-kiosk-usb.apk
          retention-days: 30

      - name: Create GitHub Release with APK (main branch)
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi

          TAG="v${GITHUB_RUN_NUMBER}"
          gh --version

          # Create (or replace) release
          gh release delete "$TAG" -y || true
          gh release create "$TAG" release-apks/awkaf-kiosk-usb.apk \
            --title "Release $TAG" \
            --notes "## Awkaf Payment Kiosk APK\n\nUSB POS Support Included\n\n### Installation:\n1. Download awkaf-kiosk-usb.apk\n2. Transfer to Samsung A13\n3. Install the APK\n4. Connect OM-A880 POS via USB OTG\n5. Grant USB permission\n"
