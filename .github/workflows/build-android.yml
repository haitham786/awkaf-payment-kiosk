name: Build Android APK — Thawani Lamsa Soft POS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build web assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Add Android platform (always fresh)
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch android/build.gradle — Thawani Maven + JitPack
        env:
          THAWANI_MAVEN_USER: ${{ secrets.THAWANI_MAVEN_USER }}
          THAWANI_MAVEN_TOKEN: ${{ secrets.THAWANI_MAVEN_TOKEN }}
        run: |
          python3 - "$THAWANI_MAVEN_USER" "$THAWANI_MAVEN_TOKEN" << 'PYEOF'
          import sys, re
          from pathlib import Path
          user  = sys.argv[1]
          token = sys.argv[2]
          print(f"user present={bool(user)}, token present={bool(token)}")
          p    = Path("android/build.gradle")
          text = p.read_text()
          thawani = (
              '\n        maven {\n'
              '            url "https://maven.pkg.github.com/ThawaniMobile/Lamsa-SDK"\n'
              '            credentials {\n'
              f'                username "{user}"\n'
              f'                password "{token}"\n'
              '            }\n'
              '        }'
          )
          jitpack = '\n        maven { url "https://jitpack.io" }'
          inject = ""
          if "ThawaniMobile" not in text: inject += thawani
          if "jitpack.io"    not in text: inject += jitpack
          if inject:
              matches = list(re.finditer(r'allprojects\s*\{[^}]*repositories\s*\{', text, re.DOTALL))
              if matches:
                  pos = matches[-1].end()
                  text = text[:pos] + inject + text[pos:]
                  p.write_text(text)
                  print("Patched allprojects repositories block")
              else:
                  print("ERROR: allprojects repositories not found"); sys.exit(1)
          else:
              print("Already patched")
          PYEOF

      - name: Restore variables.gradle (minSdkVersion=26 for Lamsa SDK)
        run: |
          cp android-config/variables.gradle android/variables.gradle
          echo "Restored variables.gradle:"
          cat android/variables.gradle

      - name: Patch android/app/build.gradle — dataBinding + Lamsa SDK
        run: |
          python3 - << 'PYEOF'
          import re
          from pathlib import Path
          p    = Path("android/app/build.gradle")
          text = p.read_text()
          if "dataBinding" not in text:
              if "buildFeatures" in text:
                  text = re.sub(r'(buildFeatures\s*\{)', r'\1\n        dataBinding true', text, count=1)
              else:
                  text = re.sub(r'(android\s*\{)', r'\1\n    buildFeatures {\n        dataBinding true\n    }', text, count=1)
              print("Added dataBinding")
          if "om.thawani" not in text:
              text = re.sub(r'(dependencies\s*\{)', r'\1\n    implementation("om.thawani:lamsa.sdk:0.0.22")', text, count=1)
              print("Added Lamsa SDK dependency")
          p.write_text(text)
          PYEOF

      - name: Copy ThawaniLamsaPlugin.java
        run: |
          DIR="android/app/src/main/java/app/lovable/awkafpaymentkiosk"
          mkdir -p "$DIR"
          cp android-plugin/ThawaniLamsaPlugin.java "$DIR/"
          echo "Plugin copied"

      # Replace MainActivity entirely — the original is empty (no onCreate),
      # so regex patching never worked. We replace it with a proper one.
      - name: Replace MainActivity.java with plugin-registering version
        run: |
          DIR="android/app/src/main/java/app/lovable/awkafpaymentkiosk"
          cp android-plugin/MainActivity.java "$DIR/MainActivity.java"
          echo "MainActivity.java replaced"
          cat "$DIR/MainActivity.java"

      - name: Patch AndroidManifest.xml — NFC + LamsaSDK activity
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          xml = p.read_text()
          if "android.permission.NFC" not in xml:
              xml = xml.replace("<application",
                  '<uses-permission android:name="android.permission.NFC" />\n'
                  '    <uses-feature android:name="android.hardware.nfc" android:required="false" />\n'
                  '    <application', 1)
          # Do NOT add LamsaSDK activity - the SDK's own manifest declares it.
          # Adding it here with exported="false" conflicts with the SDK manifest merger.
          p.write_text(xml)
          print("AndroidManifest patched")
          PYEOF

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Accept SDK licences
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build Debug APK
        working-directory: android
        env:
          THAWANI_MAVEN_USER: ${{ secrets.THAWANI_MAVEN_USER }}
          THAWANI_MAVEN_TOKEN: ${{ secrets.THAWANI_MAVEN_TOKEN }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build-full.log; exit ${PIPESTATUS[0]}

      - name: Upload full build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-log
          path: build-full.log
          retention-days: 7

      - name: Find APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: awkaf-kiosk-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Awkaf Kiosk v${{ github.run_number }} — Lamsa Soft POS"
          body: |
            ## Awkaf Payment Kiosk APK
            Build ${{ github.run_number }} | Commit ${{ github.sha }}
            Thawani Lamsa NFC Soft POS integrated.
            Admin Panel → Kiosk Settings → Soft POS → Mode: live to activate.
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Gradle error on failure
        if: failure()
        run: |
          echo "=== app/build.gradle ===" && cat android/app/build.gradle || true
          echo "=== MainActivity.java ===" && cat android/app/src/main/java/app/lovable/awkafpaymentkiosk/MainActivity.java || true
          find android/app/build -name "*.log" -exec tail -50 {} \; 2>/dev/null || true
