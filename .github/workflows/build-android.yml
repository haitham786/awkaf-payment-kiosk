name: Build Android APK with USB Support

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Thawani Lamsa SDK is optional. The Capacitor bridge (ThawaniLamsaPlugin) uses
  # Java reflection, so the APK builds and runs without the SDK when the public
  # Maven credentials are unavailable/rotated. Provide working credentials via
  # repository secrets THAWANI_MAVEN_USER / THAWANI_MAVEN_TOKEN to include it.
  THAWANI_MAVEN_USER: ${{ secrets.THAWANI_MAVEN_USER || 'ThawaniMobile' }}
  THAWANI_MAVEN_TOKEN: ${{ secrets.THAWANI_MAVEN_TOKEN }}
  LAMSA_SDK_VERSION: 0.0.31

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code (git clone - avoids action download timeouts)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          rm -rf ./* ./.??* || true
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}" || git fetch --depth 1 origin "${GITHUB_REF_NAME:-main}"
          git checkout -q FETCH_HEAD
          git rev-parse --short HEAD

      - name: Show toolchain (preinstalled)
        shell: bash
        run: |
          set -euxo pipefail
          node -v
          npm -v
          which sdkmanager || true
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"

      - name: Install Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Ensure Android SDK is available
        shell: bash
        run: |
          set -euxo pipefail
          if [ -z "${ANDROID_SDK_ROOT:-}" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          fi
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ERROR: ANDROID_SDK_ROOT is not set"
            exit 1
          fi
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_DIR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          else
            SDKMANAGER_PATH="$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
            SDKMANAGER_DIR="$(dirname "${SDKMANAGER_PATH:-}")"
          fi
          if [ -z "${SDKMANAGER_DIR:-}" ] || [ ! -x "$SDKMANAGER_DIR/sdkmanager" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          export PATH="$SDKMANAGER_DIR:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          which sdkmanager
          sdkmanager --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build web assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Add Android platform (if needed)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      # Thawani Lamsa SDK is distributed via GitHub Packages with PUBLIC credentials
      # published in their official integration docs: https://thawani.gitbook.io/lamsa
      # These are NOT private - Thawani publishes them so any developer can pull the SDK.
      - name: Verify Thawani SDK package access (optional)
        shell: bash
        env:
          THAWANI_MAVEN_USER: ${{ env.THAWANI_MAVEN_USER }}
          THAWANI_MAVEN_TOKEN: ${{ env.THAWANI_MAVEN_TOKEN }}
          LAMSA_SDK_VERSION: ${{ env.LAMSA_SDK_VERSION }}
        run: |
          set -euxo pipefail
          echo "LAMSA_SDK_AVAILABLE=false" >> "$GITHUB_ENV"
          if [ -z "${THAWANI_MAVEN_TOKEN:-}" ]; then
            echo "::warning::No THAWANI_MAVEN_TOKEN secret configured — building without the Lamsa SDK (reflection fallback)."
            exit 0
          fi
          STATUS_CODE="$(curl -sSL -o /tmp/thawani-sdk-check.txt -w '%{http_code}' -u "${THAWANI_MAVEN_USER}:${THAWANI_MAVEN_TOKEN}" "https://maven.pkg.github.com/ThawaniMobile/Lamsa-SDK/om/thawani/lamsa.sdk/${LAMSA_SDK_VERSION}/lamsa.sdk-${LAMSA_SDK_VERSION}.pom" || true)"
          echo "Thawani SDK ${LAMSA_SDK_VERSION} POM check: HTTP ${STATUS_CODE}"
          if [ "$STATUS_CODE" = "200" ] || [ "$STATUS_CODE" = "302" ]; then
            echo "LAMSA_SDK_AVAILABLE=true" >> "$GITHUB_ENV"
            echo "✓ Thawani SDK ${LAMSA_SDK_VERSION} is accessible"
          else
            echo "::warning::Cannot access Thawani Lamsa SDK ${LAMSA_SDK_VERSION} (HTTP ${STATUS_CODE}). Building without it (reflection fallback)."
            echo "::warning::Set valid THAWANI_MAVEN_USER / THAWANI_MAVEN_TOKEN repository secrets to re-enable the SDK."
            cat /tmp/thawani-sdk-check.txt || true
          fi

      - name: Ensure Maven repositories (JitPack + Thawani)
        shell: bash
        env:
          THAWANI_MAVEN_USER: ${{ env.THAWANI_MAVEN_USER }}
          THAWANI_MAVEN_TOKEN: ${{ env.THAWANI_MAVEN_TOKEN }}
          LAMSA_SDK_AVAILABLE: ${{ env.LAMSA_SDK_AVAILABLE }}
        run: |
          set -euxo pipefail
          export INCLUDE_THAWANI_REPO="${LAMSA_SDK_AVAILABLE:-false}"
          python3 - << 'PY'
          from pathlib import Path
          import os, re
          include_thawani = os.environ.get("INCLUDE_THAWANI_REPO", "false") == "true"
          def patch_repositories_block(text, snippets):
              patched = text
              for snippet in snippets:
                  if snippet["check"] not in patched:
                      patched = re.sub(r"(repositories\s*\{\s*\n)", r"\1        " + snippet["code"] + "\n", patched)
              return patched
          def patch_file(path, snippets):
              if not path.exists():
                  return
              original = path.read_text(encoding="utf-8")
              patched = patch_repositories_block(original, snippets)
              if patched != original:
                  path.write_text(patched, encoding="utf-8")
                  print(f"Patched {path}")
          common_groovy_snippets = [
              {"check": "jitpack.io", "code": 'maven { url "https://jitpack.io" }'},
          ]
          common_kts_snippets = [
              {"check": "jitpack.io", "code": 'maven { url = uri("https://jitpack.io") }'},
          ]
          thawani_groovy_snippets = [{"check": "maven.pkg.github.com/ThawaniMobile", "code": 'maven {\n            url "https://maven.pkg.github.com/ThawaniMobile/Lamsa-SDK"\n            credentials {\n                username = System.getenv("THAWANI_MAVEN_USER") ?: ""\n                password = System.getenv("THAWANI_MAVEN_TOKEN") ?: ""\n            }\n            content {\n                includeGroup "om.thawani"\n            }\n        }'}] if include_thawani else []
          thawani_kts_snippets = [{"check": "maven.pkg.github.com/ThawaniMobile", "code": 'maven {\n            url = uri("https://maven.pkg.github.com/ThawaniMobile/Lamsa-SDK")\n            credentials {\n                username = System.getenv("THAWANI_MAVEN_USER") ?: ""\n                password = System.getenv("THAWANI_MAVEN_TOKEN") ?: ""\n            }\n            content {\n                includeGroup("om.thawani")\n            }\n        }'}] if include_thawani else []
          for f in ["android/settings.gradle"]:
              patch_file(Path(f), common_groovy_snippets + thawani_groovy_snippets)
          for f in ["android/settings.gradle.kts"]:
              patch_file(Path(f), common_kts_snippets + thawani_kts_snippets)
          for f in ["android/build.gradle"]:
              patch_file(Path(f), common_groovy_snippets)
          for f in ["android/build.gradle.kts"]:
              patch_file(Path(f), common_kts_snippets)
          for f in ["android/app/build.gradle"]:
              patch_file(Path(f), common_groovy_snippets + thawani_groovy_snippets)
          for f in ["android/app/build.gradle.kts"]:
              patch_file(Path(f), common_kts_snippets + thawani_kts_snippets)
          print("Maven repositories configured")
          PY

      - name: Add dataBinding, minSdk 26, and Lamsa SDK dependency
        shell: bash
        env:
          LAMSA_SDK_VERSION: ${{ env.LAMSA_SDK_VERSION }}
          LAMSA_SDK_AVAILABLE: ${{ env.LAMSA_SDK_AVAILABLE }}
        run: |
          set -euxo pipefail
          python3 - "$LAMSA_SDK_VERSION" "${LAMSA_SDK_AVAILABLE:-false}" << 'PY'
          import sys, re
          from pathlib import Path
          version = sys.argv[1]
          include_sdk = sys.argv[2] == "true"
          if not include_sdk:
              print("Lamsa SDK not available — building with reflection fallback (no SDK dependency).")
          for vars_name in ["android/variables.gradle", "android/variables.gradle.kts"]:
              vp = Path(vars_name)
              if not vp.exists():
                  continue
              text = vp.read_text(encoding="utf-8")
              text = re.sub(r'(minSdkVersion\s*=\s*)\d+', r'\g<1>26', text)
              vp.write_text(text, encoding="utf-8")
              print(f"Patched {vp} with minSdkVersion 26 for Lamsa SDK")
          for gradle_name in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              p = Path(gradle_name)
              if not p.exists():
                  continue
              text = p.read_text(encoding="utf-8")
              text = re.sub(r'(minSdkVersion\s+)\d+', r'\g<1>26', text)
              text = re.sub(r'(minSdk\s*=\s*)\d+', r'\g<1>26', text)
              if "dataBinding" not in text:
                  if "buildFeatures" in text:
                      text = re.sub(r"(buildFeatures\s*\{)", r"\1\n        dataBinding true", text)
                  else:
                      text = re.sub(r"(android\s*\{)", r"\1\n    buildFeatures {\n        dataBinding true\n    }", text)
              # Replace any existing Lamsa/Kotlin implementation lines, then add the current versions
              text = re.sub(r'\n\s*implementation\(?["\']om\.thawani:lamsa\.sdk:[^"\']+["\']\)?', '', text)
              text = re.sub(r'\n\s*implementation\(?["\']org\.jetbrains\.kotlin:kotlin-stdlib:[^"\']+["\']\)?', '', text)
              if include_sdk:
                  text = re.sub(
                      r"(dependencies\s*\{)",
                      rf'\1\n    implementation("om.thawani:lamsa.sdk:{version}")\n    implementation("org.jetbrains.kotlin:kotlin-stdlib:1.9.24")',
                      text
                  )
              p.write_text(text, encoding="utf-8")
              print(f"Patched {p} with minSdk 26 + dataBinding" + (f" + Lamsa SDK {version}" if include_sdk else " (no Lamsa SDK)"))
          proguard = Path("android/app/proguard-rules.pro")
          if proguard.exists():
              text = proguard.read_text(encoding="utf-8")
          else:
              text = ""
          keep = "-keep class om.thawani.lamsa.sdk.** { *; }\n-keep class acrNfcReader.** { *; }\n-keep class com.module.creditCardNfcReader.** { *; }\n"
          if "om.thawani.lamsa.sdk" not in text:
              proguard.write_text(text.rstrip() + "\n" + keep, encoding="utf-8")
              print("Added Lamsa SDK keep rules")
          PY

      - name: Copy Thawani Lamsa plugin (real SDK bridge)
        shell: bash
        run: |
          set -euxo pipefail
          PLUGIN_DIR="android/app/src/main/java/app/lovable/awkafpaymentkiosk"
          mkdir -p "$PLUGIN_DIR"
          if [ -f "android-plugin/ThawaniLamsaPlugin.java" ]; then
            cp "android-plugin/ThawaniLamsaPlugin.java" "$PLUGIN_DIR/"
            echo "Copied ThawaniLamsaPlugin.java (real SDK bridge)"
          fi

      - name: Register plugin in MainActivity (deterministic rewrite)
        shell: bash
        run: |
          set -euxo pipefail
          python3 - << 'PY'
          from pathlib import Path
          import glob, re

          MAIN_JAVA = (
              "package app.lovable.awkafpaymentkiosk;\n\n"
              "import android.os.Bundle;\n"
              "import com.getcapacitor.BridgeActivity;\n"
              "import app.lovable.awkafpaymentkiosk.ThawaniLamsaPlugin;\n\n"
              "public class MainActivity extends BridgeActivity {\n"
              "    @Override\n"
              "    public void onCreate(Bundle savedInstanceState) {\n"
              "        registerPlugin(ThawaniLamsaPlugin.class);\n"
              "        super.onCreate(savedInstanceState);\n"
              "    }\n"
              "}\n"
          )

          # Remove any stray Kotlin MainActivity that Capacitor may have generated
          for f in glob.glob("android/app/src/main/java/**/MainActivity.kt", recursive=True):
              Path(f).unlink()
              print(f"Removed Kotlin MainActivity: {f}")

          # Always rewrite the Java MainActivity at the canonical Capacitor path
          target_dir = Path("android/app/src/main/java/app/lovable/awkafpaymentkiosk")
          target_dir.mkdir(parents=True, exist_ok=True)
          target = target_dir / "MainActivity.java"
          target.write_text(MAIN_JAVA, encoding="utf-8")
          print(f"Wrote canonical MainActivity.java at {target}")

          # Remove duplicate MainActivity.java files anywhere else in the source tree
          for f in glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True):
              p = Path(f).resolve()
              if p != target.resolve():
                  p.unlink()
                  print(f"Removed duplicate MainActivity.java: {p}")
          PY

      - name: Assert MainActivity registers ThawaniLamsa plugin
        shell: bash
        run: |
          set -euxo pipefail
          MAIN="android/app/src/main/java/app/lovable/awkafpaymentkiosk/MainActivity.java"
          test -f "$MAIN" || { echo "::error::MainActivity.java missing at $MAIN"; exit 1; }
          echo "=== Final MainActivity.java ==="
          cat "$MAIN"
          echo "==============================="
          grep -q "extends BridgeActivity" "$MAIN" || { echo "::error::MainActivity does not extend BridgeActivity"; exit 1; }
          grep -q "import android.os.Bundle;" "$MAIN" || { echo "::error::Missing Bundle import"; exit 1; }
          grep -q "registerPlugin(ThawaniLamsaPlugin.class);" "$MAIN" || { echo "::error::ThawaniLamsaPlugin is not registered"; exit 1; }
          echo "✓ MainActivity correctly registers ThawaniLamsaPlugin"

          PLUGIN="android/app/src/main/java/app/lovable/awkafpaymentkiosk/ThawaniLamsaPlugin.java"
          test -f "$PLUGIN" || { echo "::error::ThawaniLamsaPlugin.java was not copied to $PLUGIN"; exit 1; }
          echo "✓ ThawaniLamsaPlugin.java is present in the source tree"

      - name: Create USB device filter XML
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/device_filter.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device vendor-id="1478" product-id="36923" />
              <usb-device vendor-id="1478" product-id="36945" />
              <usb-device vendor-id="1478" product-id="36946" />
              <usb-device vendor-id="3398" product-id="16385" />
              <usb-device vendor-id="3398" product-id="16386" />
              <usb-device vendor-id="7568" product-id="8218" />
              <usb-device vendor-id="6790" product-id="29987" />
              <usb-device vendor-id="1659" product-id="8963" />
              <usb-device vendor-id="1027" product-id="24577" />
              <usb-device vendor-id="4292" product-id="60000" />
              <usb-device class="2" subclass="2" protocol="1" />
          </resources>
          EOF

      - name: Patch AndroidManifest.xml for USB + NFC
        shell: bash
        env:
          LAMSA_SDK_AVAILABLE: ${{ env.LAMSA_SDK_AVAILABLE }}
        run: |
          set -euxo pipefail
          python3 - << 'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              raise SystemExit("AndroidManifest.xml not found")
          xml = p.read_text(encoding="utf-8")
          if "android.hardware.usb.host" not in xml:
              xml = xml.replace("<application", '<uses-feature android:name="android.hardware.usb.host" android:required="false" />\n    <uses-feature android:name="android.hardware.nfc" android:required="false" />\n    <uses-permission android:name="android.permission.NFC" />\n    <application', 1)
          if "android.hardware.usb.action.USB_DEVICE_ATTACHED" not in xml:
              inject = '\n                <intent-filter>\n                    <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />\n                </intent-filter>\n                <meta-data\n                    android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"\n                    android:resource="@xml/device_filter" />\n        '
              pattern_main = r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>)(.*?)(</activity>)'
              m = re.search(pattern_main, xml, flags=re.S)
              if not m:
                  pattern_any = r'(<activity\b[^>]*>)(.*?)(</activity>)'
                  for mi in re.finditer(pattern_any, xml, flags=re.S):
                      block = mi.group(0)
                      if "android.intent.action.MAIN" in block and "android.intent.category.LAUNCHER" in block:
                          m = mi
                          break
              if m:
                  head, body, tail = m.group(1), m.group(2), m.group(3)
                  xml = xml[:m.start(0)] + head + body + inject + tail + xml[m.end(0):]
          import os
          include_sdk = os.environ.get("LAMSA_SDK_AVAILABLE", "false") == "true"
          if include_sdk:
              if 'android:name="om.thawani.lamsa.sdk.LamsaSDK"' not in xml:
                  activity = '\n        <activity\n            android:name="om.thawani.lamsa.sdk.LamsaSDK"\n            android:parentActivityName=".MainActivity"\n            android:theme="@style/Theme.LamsaSDK" />\n'
                  xml = xml.replace('</application>', activity + '    </application>', 1)
              xml = xml.replace('android:name="om.thawani.lamsa.sdk.LamsaSDK"\n            android:parentActivityName=".MainActivity"', 'android:name="om.thawani.lamsa.sdk.LamsaSDK"\n            android:exported="true"\n            android:parentActivityName=".MainActivity"')
          else:
              print("Lamsa SDK not bundled — skipping LamsaSDK manifest activity")
          p.write_text(xml, encoding="utf-8")
          print("AndroidManifest.xml patched (USB + NFC)")
          PY

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Verify Android SDK tools + accept licenses
        shell: bash
        run: |
          set -euxo pipefail
          which sdkmanager
          sdkmanager --version
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          if sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"; then
            echo "Installed Android SDK 35"
          else
            sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
            if [ -f android/variables.gradle ]; then
              perl -pi -e 's/(compileSdkVersion\s*=\s*)\d+/${1}34/g; s/(targetSdkVersion\s*=\s*)\d+/${1}34/g' android/variables.gradle || true
            fi
          fi

      - name: Ensure Android SDK path (local.properties)
        shell: bash
        run: |
          set -euxo pipefail
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties

      - name: Create temporary APK signing key
        shell: bash
        run: |
          set -euxo pipefail
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore android/app/awkaf-release-key.p12 \
            -alias awkaf_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Awkaf Payment Kiosk, OU=Kiosk, O=Awkaf, L=Muscat, ST=Muscat, C=OM"

      - name: Build unsigned Release APK
        working-directory: android
        shell: bash
        timeout-minutes: 20
        env:
          THAWANI_MAVEN_USER: ${{ env.THAWANI_MAVEN_USER }}
          THAWANI_MAVEN_TOKEN: ${{ env.THAWANI_MAVEN_TOKEN }}
        run: |
          set -euxo pipefail
          echo "Building APK with Thawani Lamsa SDK ${LAMSA_SDK_VERSION:-bundled}"
          ./gradlew assembleRelease \
            -Pandroid.injected.testOnly=false \
            --stacktrace --info --no-daemon 2>&1 | tee ../android-gradle.log

      - name: Sign release APK externally
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-apks
          BUILD_TOOLS_DIR="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -type f \( -name '*-unsigned.apk' -o -name '*.apk' \) | head -n 1)"
          test -n "$UNSIGNED_APK"
          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" release-apks/awkaf-kiosk-usb-aligned.apk
          "$APKSIGNER" sign \
            --ks android/app/awkaf-release-key.p12 \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias awkaf_release \
            --out release-apks/awkaf-kiosk-usb.apk \
            release-apks/awkaf-kiosk-usb-aligned.apk
          "$APKSIGNER" verify --verbose release-apks/awkaf-kiosk-usb.apk

      - name: List Android build outputs (always)
        if: always()
        shell: bash
        run: |
          find android -maxdepth 8 -type f \( -name "*.apk" -o -name "*.log" \) 2>/dev/null || true
          if [ -f android-gradle.log ]; then
            tail -n 200 android-gradle.log || true
          fi

      - name: Collect APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          test -f release-apks/awkaf-kiosk-usb.apk
          ls -lh release-apks/awkaf-kiosk-usb.apk

      - name: Verify APK is installable (no testOnly flag, valid signature)
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          APK="release-apks/awkaf-kiosk-usb.apk"
          BUILD_TOOLS_DIR="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          echo "=== APK file info ==="
          ls -lh "$APK"
          file "$APK"
          echo ""
          echo "=== Manifest flags (testOnly must be absent / false) ==="
          if [ -x "$AAPT" ]; then
            "$AAPT" dump badging "$APK" 2>&1 | head -20 || true
            TEST_ONLY="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml 2>/dev/null | grep -i 'testOnly' || true)"
            if echo "$TEST_ONLY" | grep -q '0xffffffff\|=true\|=(type 0x12)0xffffffff'; then
              echo "::error::APK has testOnly=true flag. It will fail to install via sideload."
              echo "$TEST_ONLY"
              exit 1
            fi
            echo "✓ testOnly flag is not set (sideload-installable)"
          fi
          echo ""
          echo "=== Signature verification (v1/v2/v3) ==="
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK" || {
              echo "::error::APK signature verification failed"
              exit 1
            }
            echo "✓ APK signature is valid"
          fi

      - name: Verify Capacitor bridge (and Lamsa SDK when bundled) in APK
        if: success()
        shell: bash
        env:
          LAMSA_SDK_AVAILABLE: ${{ env.LAMSA_SDK_AVAILABLE }}
        run: |
          set -euxo pipefail
          APK="release-apks/awkaf-kiosk-usb.apk"
          unzip -l "$APK" | grep -E 'classes[0-9]*\.dex'
          rm -rf /tmp/apk-dex-check
          mkdir -p /tmp/apk-dex-check
          unzip -q "$APK" 'classes*.dex' -d /tmp/apk-dex-check
          if [ "${LAMSA_SDK_AVAILABLE:-false}" = "true" ]; then
            if ! grep -aR "om/thawani/lamsa/sdk/LamsaSDK" /tmp/apk-dex-check >/dev/null; then
              echo "::error::Thawani Lamsa SDK class is missing from the APK dex files."
              exit 1
            fi
            if ! grep -aR "om/thawani/lamsa/sdk/models/InitOptionsModel" /tmp/apk-dex-check >/dev/null; then
              echo "::error::Thawani InitOptionsModel class is missing from the APK dex files."
              exit 1
            fi
          else
            echo "Lamsa SDK not bundled (reflection fallback) — skipping SDK dex checks"
          fi
          if ! grep -aR "app/lovable/awkafpaymentkiosk/ThawaniLamsaPlugin" /tmp/apk-dex-check >/dev/null; then
            echo "::error::Capacitor bridge class ThawaniLamsaPlugin is missing from the APK dex files."
            echo "::error::This means MainActivity registration or plugin compilation failed."
            exit 1
          fi
          if ! grep -aR "app/lovable/awkafpaymentkiosk/MainActivity" /tmp/apk-dex-check >/dev/null; then
            echo "::error::MainActivity class is missing from the APK dex files."
            exit 1
          fi
          echo "✓ Thawani Lamsa SDK + Capacitor bridge classes are bundled in the APK"

      - name: Add installation instructions beside APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          cat > release-apks/README-INSTALL.txt << 'EOF'
          IMPORTANT:
          Install ONLY the file named awkaf-kiosk-usb.apk.

          If you download from GitHub Actions, GitHub gives you a ZIP file.
          Android cannot install that ZIP directly and may show:
          "Unable to open document. Reason: Internal error occurred"

          Correct install options:
          1. Best: open this workflow's GitHub Release and download awkaf-kiosk-usb.apk directly.
          2. Or: unzip the GitHub Actions artifact first, then install awkaf-kiosk-usb.apk from inside it.
          This APK is a signed release build, not a debug/test APK.
          EOF

      - name: Upload ZIP artifact (unzip before installing)
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: UNZIP-FIRST-then-install-awkaf-kiosk-usb-apk
          path: |
            release-apks/awkaf-kiosk-usb.apk
            release-apks/README-INSTALL.txt
          retention-days: 30

      - name: Create GitHub Release with APK
        if: success() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          TAG="v${GITHUB_RUN_NUMBER}"
          gh release delete "$TAG" -y || true
          gh release create "$TAG" release-apks/awkaf-kiosk-usb.apk \
            --title "Release $TAG" \
            --notes "Download the APK from this Release asset directly on the Android device. Do not install the GitHub Actions artifact ZIP; if you downloaded the artifact, unzip it first and install awkaf-kiosk-usb.apk from inside. Awkaf Payment Kiosk APK - Soft POS (Thawani Lamsa SDK) + Payment Gateway + NFC + Bilingual UI"
